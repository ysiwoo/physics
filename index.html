<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇠구슬 물리 실험 시뮬레이션</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>쇠구슬 물리 실험 시뮬레이션</h1>
  <nav class="motion-nav">
    <button class="motion-btn active" data-motion="freefall">자유낙하 운동</button>
    <button class="motion-btn" data-motion="projectile">포물선 운동</button>
    <button class="motion-btn" data-motion="pendulum">단진자 운동</button>
  </nav>
</header>

<main class="layout">

  <aside class="controls">
    <section class="control-group">
      <h2>화면 테마</h2>
      <div class="theme-toggle">
        <button type="button" class="theme-btn" data-theme="dark">🌙 다크</button>
        <button type="button" class="theme-btn" data-theme="light">☀️ 라이트</button>
      </div>
    </section>

    <section class="control-group">
      <h2>물체 (쇠구슬)</h2>
      <label>질량 (g)
        <input type="number" id="mass" value="50" min="1" max="5000" step="1">
      </label>
      <label>반지름 (cm)
        <input type="number" id="radius" value="1" min="0.1" max="10" step="0.1">
      </label>
      <button type="button" id="massFromRadius">강철 밀도로 질량 계산</button>

      <label>중력가속도 g (m/s²)
        <input type="number" id="gravity" value="9.8" min="1" max="25" step="0.1">
      </label>

      <label class="checkbox-row">
        <input type="checkbox" id="airResistance">
        실제 상황 (공기저항 적용)
      </label>

      <div id="airParams" class="sub-params hidden">
        <label>공기 밀도 ρ (kg/m³)
          <input type="number" id="airDensity" value="1.225" min="0" max="5" step="0.001">
        </label>
        <label>항력 계수 Cd
          <input type="number" id="dragCoef" value="0.47" min="0" max="2" step="0.01">
        </label>
      </div>
    </section>

    <section class="control-group" data-motion-panel="freefall">
      <h2>자유낙하 조건</h2>
      <label>낙하 높이 h (m)
        <input type="number" id="ff_height" value="20" min="1" max="200" step="0.5">
      </label>
      <label>반발 계수 e (바닥 튕김)
        <input type="number" id="ff_restitution" value="0.7" min="0" max="0.98" step="0.01">
      </label>
    </section>

    <section class="control-group hidden" data-motion-panel="projectile">
      <h2>포물선 운동 조건</h2>
      <label>초기 속력 v₀ (m/s)
        <input type="number" id="pj_v0" value="20" min="0.5" max="100" step="0.5">
      </label>
      <label>발사각 θ (°)
        <input type="number" id="pj_angle" value="45" min="0" max="90" step="1">
      </label>
      <label>초기 높이 h₀ (m)
        <input type="number" id="pj_h0" value="0" min="0" max="50" step="0.5">
      </label>
      <label>반발 계수 e (바닥 튕김)
        <input type="number" id="pj_restitution" value="0.6" min="0" max="0.98" step="0.01">
      </label>
    </section>

    <section class="control-group hidden" data-motion-panel="pendulum">
      <h2>단진자 운동 조건</h2>
      <label>줄 길이 L (m)
        <input type="number" id="pd_length" value="1" min="0.1" max="5" step="0.05">
      </label>
      <label>초기 각도 θ₀ (°)
        <input type="number" id="pd_angle" value="30" min="1" max="90" step="1">
      </label>
      <label>최소 진동 횟수 (반복 재생 기준)
        <input type="number" id="pd_periods" value="4" min="1" max="15" step="1">
      </label>
    </section>

    <section class="control-group">
      <h2>재생</h2>
      <div class="playback-row">
        <button type="button" id="playBtn">▶ 재생</button>
        <button type="button" id="resetBtn">⟲ 초기화</button>
      </div>
      <label>재생 속도
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <div class="readout" id="readout">시간: 0.00 s</div>
    </section>
  </aside>

  <section class="main-view">
    <div class="canvas-wrap">
      <canvas id="simCanvas" width="560" height="380"></canvas>
    </div>
    <div class="chart-wrap">
      <canvas id="chartCanvas"></canvas>
    </div>
  </section>

  <section class="table-wrap">
    <h2>측정값 표</h2>
    <div class="table-scroll">
      <table id="dataTable">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/physics.js"></script>
<script src="js/main.js"></script>
</body>
</html>
